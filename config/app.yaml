operational:
  # Prognoza operacyjna obejmuje wyłącznie modele ex ante, czyli bez zmiennych zewnętrznych. Prognozy wiatru i PV
  # na dobę następną ENTSO-E publikuje najpóźniej o 18:00 w dniu poprzedzającym dostawę (pomiar 11.11.2026:
  # między 15:17 a 18:14), a więc po zamknięciu aukcji. Modele _x i sarimax są oceniane tylko w badaniu
  # (docs/decisions.md, sekcja 11).
  models: [naive_mixed, arx, lear, xgb, mlp, sarima]
  history_start: "2024-01-01"                                    # od kiedy historia cen trafia do aplikacji